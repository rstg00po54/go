name: Vivo MediaTek LiteRT probe APK

on:
  workflow_dispatch:
  push:
    branches: [feature/rk3588-rknn, feature/vivo-mediatek-litert]
    paths:
      - '.github/workflows/vivo_litert_android_apk.yml'
      - 'GoEngine-java/app/build.gradle.kts'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoMediaTekLiteRt.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/MainActivity.java'
      - 'GoEngine-java/tools/prepare_vivo_litert.sh'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35"
      - name: Stage CPU-validated KataGo LiteRT graphs
        working-directory: GoEngine-java
        run: bash tools/prepare_vivo_litert.sh
      - name: Assemble MediaTek APK (without RKNN binaries)
        working-directory: GoEngine-java
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PskipKataGoNative=true -PvivoProbeApk=true -PenableKataGoNpuJni=false -PenableKataGoGpuJni=false -PenableKataGoJniCore=false --no-daemon
      - name: Inspect APK models and vendor NPU runtime
        run: |
          set -euo pipefail
          APK=GoEngine-java/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E "katago_10b_(9x9|13x13|19x19)\.(tflite|json)"
          unzip -l "$APK" | grep -i -E "LiteRt(CompilerPlugin|Dispatch)_MediaTek|libLiteRt.so|liblitert"
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/librknnrt.so"; then
            echo "ERROR: RKNN runtime accidentally packaged into Vivo APK" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-katago-litert-debug-apk
          path: GoEngine-java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
