name: Preview original jade navbar assets
on:
  push:
    branches: [feature/jade-home-game-ui]
    paths:
      - .github/workflows/jade_nav_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Describe and downsample original bar
        run: |
          set -e
          file GoEngine-java/docs/navbar/*.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import io,base64
          for name in ['bar','home','game','record','training','settings']:
            im=Image.open(f'GoEngine-java/docs/navbar/{name}.png')
            print(f'NAV_SOURCE {name} {im.size} mode={im.mode}')
            if name=='bar':
              im.thumbnail((650,200))
              out=io.BytesIO()
              im.save(out,'PNG',optimize=True)
              data=base64.b64encode(out.getvalue()).decode()
              print("NAV_ORIGINAL_PREVIEW_BEGIN")
              for i in range(0,len(data),3000): print(data[i:i+3000])
              print("NAV_ORIGINAL_PREVIEW_END")
          PY
