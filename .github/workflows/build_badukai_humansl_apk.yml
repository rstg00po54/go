name: Build Badukai Human SL APK

on:
  push:
    branches: [rk3588-engine]
    paths:
      - 'GoEngine-java/app/**'
      - 'GoEngine-java/build.gradle.kts'
      - 'GoEngine-java/settings.gradle.kts'
      - 'GoEngine-java/gradle/**'
      - '.github/workflows/build_badukai_humansl_apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 34
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Include official Human SL model in APK
        run: |
          set -euo pipefail
          MODEL="GoEngine-java/app/src/main/assets/engine/b18c384nbt-humanv0.bin.gz"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30             "https://github.com/lightvector/KataGo/releases/download/v1.15.0/b18c384nbt-humanv0.bin.gz" -o "$MODEL"
          test "$(stat -c '%s' "$MODEL")" -eq 99066230
          gzip -t "$MODEL"
          echo "637746e44f0efe00ad1245a50aa9bbf0716efe364c43965ead97bd6835d84ab5  $MODEL" | sha256sum -c -

      - name: Build Android debug APK
        working-directory: GoEngine-java
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK with offline Human SL
        uses: actions/upload-artifact@v4
        with:
          name: BadukaiJ-HumanSL-arm64-debug-apk
          path: GoEngine-java/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
