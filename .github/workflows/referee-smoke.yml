name: Smart referee core tests

on:
  push:
    branches: [rk3588-engine]
    paths:
      - ".github/workflows/referee-smoke.yml"
      - "GoEngine-java/app/src/main/java/com/badukai/game/**"
      - "GoEngine-java/tools/test_smart_referee.py"
      - "GoEngine-java/tools/test_benchmark_endgame_referee_protocol.py"
      - "GoEngine-java/tools/benchmark_endgame_referee_android.py"
  pull_request:
    paths:
      - ".github/workflows/referee-smoke.yml"
      - "GoEngine-java/app/src/main/java/com/badukai/game/**"
      - "GoEngine-java/tools/test_smart_referee.py"
      - "GoEngine-java/tools/test_benchmark_endgame_referee_protocol.py"
      - "GoEngine-java/tools/benchmark_endgame_referee_android.py"
  workflow_dispatch:

jobs:
  referee-jdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GoEngine-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and test actual referee Java classes
        run: python3 tools/test_smart_referee.py
      - name: Syntax-check real Android referee benchmark
        run: python3 -m py_compile tools/benchmark_endgame_referee_android.py
      - name: Test Java/Python referee TSV protocol
        run: python3 tools/test_benchmark_endgame_referee_protocol.py
