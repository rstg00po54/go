name: Smart referee core tests

on:
  workflow_dispatch:
  push:
    branches: [rk3588-engine]
    paths:
      - .github/workflows/referee-smoke.yml
      - GoEngine-java/app/src/main/java/com/badukai/MainActivity.java
      - GoEngine-java/app/src/main/java/com/badukai/ui/GoBoardView.java
      - GoEngine-java/tools/test_smoke_android_referee_app.py

jobs:
  referee-jdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GoEngine-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make adb available to host-side smoke harness tests
        run: sudo apt-get update -qq && sudo apt-get install -y adb
      - name: Compile and test actual referee Java classes
        run: python3 tools/test_smart_referee.py
      - name: Syntax-check real Android referee benchmark
        run: python3 -m py_compile tools/benchmark_endgame_referee_android.py
      - name: Test Java/Python referee TSV protocol
        run: python3 tools/test_benchmark_endgame_referee_protocol.py
      - name: Test local SGF tactical probe protocol
        run: python3 tools/test_benchmark_endgame_life_probe.py
      - name: Syntax-check local probe
        run: python3 -m py_compile tools/benchmark_endgame_life_probe_android.py
      - name: Smoke harness parser tests (ADB not required)
        run: python3 tools/test_smoke_android_referee_app.py
      - name: Syntax-check Android ADB smoke harness
        run: python3 -m py_compile tools/smoke_android_referee_app.py
      - name: Test persistent GitHub result uploader with isolated local repository
        run: python3 tools/test_upload_referee_test_results.py
      - name: Syntax-check uploader
        run: python3 -m py_compile tools/upload_referee_test_results.py
