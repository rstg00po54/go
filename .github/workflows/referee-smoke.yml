name: KataGo NN estimate regression

on:
  workflow_dispatch:
  push:
    branches: [rk3588-engine]
    paths:
      - GoEngine-java/app/src/main/java/com/badukai/MainActivity.java
      - GoEngine-java/app/src/main/java/com/badukai/ui/GoBoardView.java
      - GoEngine-java/app/src/main/java/com/badukai/game/NnAreaScore.java
      - GoEngine-java/app/src/main/res/layout/activity_main.xml
      - GoEngine-java/tools/smoke_android_referee_app.py
      - GoEngine-java/tools/test_smoke_android_referee_app.py
      - GoEngine-java/tools/test_smart_referee.py
      - GoEngine-java/tools/upload_referee_test_results.py
      - GoEngine-java/tools/test_upload_referee_test_results.py
      - .github/workflows/referee-smoke.yml

permissions:
  contents: read
jobs:
  nn-host:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: GoEngine-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install ADB for host smoke harness
        run: sudo apt-get update -qq && sudo apt-get install -y adb
      - name: JDK NN area calculation tests
        run: python3 tools/test_smart_referee.py
      - name: Android NN smoke host tests
        run: python3 tools/test_smoke_android_referee_app.py
      - name: Python syntax checks
        run: python3 -m py_compile tools/smoke_android_referee_app.py tools/test_smoke_android_referee_app.py tools/test_smart_referee.py
      - name: Check test-report uploader
        run: python3 tools/test_upload_referee_test_results.py
