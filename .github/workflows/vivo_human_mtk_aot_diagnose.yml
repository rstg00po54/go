name: Diagnose Human SL b18 with MediaTek host AOT compiler

on:
  workflow_dispatch:
  push:
    branches: [feature/rk3588-rknn]
    paths:
      - '.github/workflows/vivo_human_mtk_aot_diagnose.yml'

permissions:
  contents: write

jobs:
  compile-human-9:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Neuron AOT plugin for MT6993
        run: |
          python -m pip install -U pip
          python -m pip install 'ai-edge-litert==2.1.5' 'ai-edge-litert-sdk-mediatek==2.1.5' 'tflite>=2.10'
          python -c "from ai_edge_litert.aot import aot_compile; from ai_edge_litert.aot.vendors.mediatek import target; print('NEURON_AOT_HOST_READY')"
      - name: Download pinned official b18 Human 9x9 LiteRT graph
        run: |
          set -euo pipefail
          mkdir -p input diagnostics
          curl -fL --retry 3 -o input/human9.tflite \
            https://github.com/rstg00po54/go/releases/download/vivo-human-litert-9-13-19-experimental-v0/katago_human_9x9.tflite
          echo '460463f71eb61fb8e5fd48df0309775de40cde520874edc402e07106e5f45d09  input/human9.tflite' | sha256sum -c
      - name: Test Neuron AOT compilation independently of vivo Android HAL
        shell: bash
        run: |
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee diagnostics/human9_aot.log
          import traceback
          from ai_edge_litert.aot import aot_compile as compiler
          from ai_edge_litert.aot.vendors.mediatek import target as mtk
          print('HUMAN_AOT_BEGIN model=b18c384nbt-humanv0 board=9 target=MT6993',flush=True)
          try:
              import inspect
              print('HUMAN_AOT_COMPILER_SIGNATURE', inspect.signature(compiler.aot_compile),flush=True)
              result = compiler.aot_compile(
                  'input/human9.tflite',
                  target=[mtk.Target(mtk.SocModel.MT6993)],
                  output_dir='diagnostics/aot_output',
                  keep_going=False)
              print('HUMAN_AOT_COMPILE_PASS result=', str(result)[:400],flush=True)
              if result.failed_backends or len(result.models_with_backend) != 1:
                  raise RuntimeError('AOT result is partial, cannot package')
              import os
              model = result.models_with_backend[0][1]
              output = 'diagnostics/human_9x9_mediatek_mt6993_aot.tflite'
              print('HUMAN_AOT_MODEL_API', [x for x in dir(model) if 'save' in x or 'export' in x],flush=True)
              model.save(output, export_only=True)
              print('HUMAN_AOT_SAVED', output, os.path.getsize(output),flush=True)
          except Exception as exc:
              print('HUMAN_AOT_COMPILE_FAIL:',repr(exc),flush=True)
              traceback.print_exc()
              raise
          PY
      - name: Verify AOT bytecode file and preserve original Human metadata identity
        run: |
          set -euo pipefail
          test -s diagnostics/human_9x9_mediatek_mt6993_aot.tflite
          curl -fL --retry 3 -o diagnostics/human_original.json \
            https://github.com/rstg00po54/go/releases/download/vivo-human-litert-9-13-19-experimental-v0/katago_human_9x9.json
          python - <<'PY'
          import json
          manifest=json.load(open('diagnostics/human_original.json'))
          assert manifest['graphSha256']=='460463f71eb61fb8e5fd48df0309775de40cde520874edc402e07106e5f45d09'
          assert manifest['cpu_inference']=='PASS'
          print('HUMAN_AOT_SOURCE_MANIFEST_VERIFIED')
          PY
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('diagnostics/human_original.json').read_text())
          assert manifest['weights']=='b18c384nbt-humanv0' and manifest['size']==9
          assert manifest['numInputMetaChannels']==192 and manifest['numPolicyChannels']==2
          output=Path('diagnostics/human_9x9_mediatek_mt6993_aot.tflite')
          import math, tflite
          tflite_model=tflite.Model.GetRootAsModel(output.read_bytes(),0)
          sg=tflite_model.Subgraphs(0)
          def tensors(inputs):
              return [sg.Tensors(inputs(i)) for i in range(inputs.__self__.InputsLength())]
          def shape(t):
              return [int(t.Shape(i)) for i in range(t.ShapeLength())]
          input_sizes=sorted(math.prod(shape(sg.Tensors(sg.Inputs(i)))) for i in range(sg.InputsLength()))
          output_sizes=sorted(math.prod(shape(sg.Tensors(sg.Outputs(i)))) for i in range(sg.OutputsLength()))
          assert input_sizes == sorted([22*81,19,192,81]), 'AOT modified four Human input tensor sizes'
          assert output_sizes == sorted([2,2*81,3,6,81]), 'AOT modified Human output tensor sizes'
          assert all(v > 0 for i in range(sg.InputsLength()) for v in shape(sg.Tensors(sg.Inputs(i))))
          assert all(v > 0 for i in range(sg.OutputsLength()) for v in shape(sg.Tensors(sg.Outputs(i))))
          print('HUMAN_AOT_IO_CONTRACT_PASS',input_sizes,output_sizes,flush=True)
          in_sizes={22*81:'InputSpatial',19:'InputGlobal',192:'InputMeta',81:'InputMask'}
          out_sizes={2:'OutputPolicyPass',162:'OutputPolicy',3:'OutputValue',
                     6:'OutputScoreValue',81:'OutputOwnership'}
          manifest['inputOrder']=[]
          manifest['outputOrder']=[]
          for i in range(sg.InputsLength()):
              tidx=sg.Inputs(i)
              tensor=sg.Tensors(tidx)
              dims=shape(tensor)
              key=in_sizes[math.prod(dims)]
              if key=='InputSpatial':
                  assert dims in ([1,22,9,9],[1,9,9,22]), 'Unsupported AOT spatial layout'
              manifest['inputOrder'].append(key)
              manifest['inputs'][key]={'name':tensor.Name().decode('utf8','replace'),
                                      'shape':dims,'count':math.prod(dims),'index':int(tidx)}
          for i in range(sg.OutputsLength()):
              tidx=sg.Outputs(i)
              tensor=sg.Tensors(tidx)
              dims=shape(tensor)
              key=out_sizes[math.prod(dims)]
              if key=='OutputPolicy':
                  assert dims in ([1,2,9,9],[1,9,9,2]), 'Unsupported AOT policy layout'
              manifest['outputOrder'].append(key)
              manifest['outputs'][key]={'name':tensor.Name().decode('utf8','replace'),
                                       'shape':dims,'count':math.prod(dims),'index':int(tidx)}
          print('HUMAN_AOT_IO_BUFFER_ORDER',manifest['inputOrder'],
                manifest['outputOrder'],flush=True)
          hash=hashlib.sha256(output.read_bytes()).hexdigest()
          manifest['sourceGraphSha256']=manifest['graphSha256']
          manifest['graphSha256']=hash
          manifest['aotCompileTarget']='MT6993'
          manifest['aotCompileStatus']='PASS'
          manifest['cpuInferenceValidationScope']='source_tflite_only'
          Path('diagnostics/human_9x9_mediatek_mt6993_aot.json').write_text(
              json.dumps(manifest,indent=2)+'\n')
          print('HUMAN_AOT_GRAPH_HASH',hash, 'size',output.stat().st_size)
          PY
          sha256sum diagnostics/human_9x9_mediatek_mt6993_aot.tflite \
            diagnostics/human_9x9_mediatek_mt6993_aot.json \
            > diagnostics/HUMAN_AOT_SHA256SUMS
          cat diagnostics/HUMAN_AOT_SHA256SUMS
      - name: Publish opt-in AOT test model only after original Human I/O checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="vivo-human-9x9-mt6993-aot-neuron-test-v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "Experimental KataGo b18 Human 9x9 MT6993 AOT (unverified on device)" \
              --notes "Compiled on Linux with public MediaTek AOT plugin. The original b18 Human SL and 192-dimensional rank input contract are preserved. AOT compilation succeeded but device Neuron runtime compatibility and Eigen numerical parity are UNVERIFIED. For debug-only testing; normal Human SL keeps CPU fallback."
          fi
          gh release upload "$TAG" \
            diagnostics/human_9x9_mediatek_mt6993_aot.tflite \
            diagnostics/human_9x9_mediatek_mt6993_aot.json \
            diagnostics/HUMAN_AOT_SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-b18-mediatek-aot-compile-diagnostics
          path: |
            diagnostics/*.log
            diagnostics/*mt6993_aot.tflite
            diagnostics/*mt6993_aot.json
            diagnostics/HUMAN_AOT_SHA256SUMS
          if-no-files-found: warn
