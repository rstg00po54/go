name: Vivo LiteRT Android Java compile

on:
  push:
    branches: [feature/rk3588-rknn, feature/vivo-mediatek-litert]
    paths:
      - '.github/workflows/vivo_litert_android_compile.yml'
      - 'GoEngine-java/app/build.gradle.kts'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoMediaTekLiteRt.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoLiteRtOutputScale.java'
      - 'GoEngine-java/tools/test_litert_output_scale.py'
      - 'GoEngine-java/tools/prepare_vivo_litert.sh'
      - 'GoEngine-java/tools/verify_vivo_litert_apk.py'
      - 'GoEngine-java/tools/test_verify_vivo_litert_apk.py'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoMediaTekNative.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoMediaTekGtpSmoke.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoGtpConfig.java'
      - 'GoEngine-java/tools/test_mediatek_gtp_config.py'
      - 'GoEngine-java/tools/smoke_vivo_litert.py'
      - 'GoEngine-java/tools/test_smoke_vivo_litert.py'
      - 'GoEngine-java/app/src/main/java/com/badukai/MainActivity.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/DeviceHardwareInfo.java'
      - 'GoEngine-java/app/src/main/res/layout/dialog_new_game.xml'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/NpuHardware.java'
      - 'GoEngine-java/tools/test_npu_hardware_selector.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runtime SoC selection on JVM
        working-directory: GoEngine-java
        run: python3 tools/test_npu_hardware_selector.py
      - name: Check original and scale-aware APK manifest hashes
        working-directory: GoEngine-java
        run: python3 tools/test_verify_vivo_litert_apk.py
      - name: Verify KataGo ONNX scale8 reconstruction on JVM
        working-directory: GoEngine-java
        run: python3 tools/test_litert_output_scale.py
      - name: Check LiteRT smoke report parsing
        working-directory: GoEngine-java
        run: python3 tools/test_smoke_vivo_litert.py
      - name: Check MediaTek GTP config overrides on JVM
        working-directory: GoEngine-java
        run: python3 tools/test_mediatek_gtp_config.py
      - name: Install Android SDK API 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35"
      - name: Compile Java with MediaTek LiteRT bindings
        working-directory: GoEngine-java
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac -PskipKataGoNative=true -PenableKataGoNpuJni=false --no-daemon --stacktrace
