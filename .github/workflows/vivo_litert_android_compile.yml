name: Vivo LiteRT Android Java compile

on:
  push:
    branches: [feature/vivo-mediatek-litert]
    paths:
      - '.github/workflows/vivo_litert_android_compile.yml'
      - 'GoEngine-java/app/build.gradle.kts'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoMediaTekLiteRt.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/MainActivity.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK API 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35"
      - name: Compile Java with MediaTek LiteRT bindings
        working-directory: GoEngine-java
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac -PskipKataGoNative=true -PenableKataGoNpuJni=false --no-daemon --stacktrace
