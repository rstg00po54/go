name: Build KataGo Neuron JNI

on:
  push:
    paths:
      - 'GoEngine-java/app/src/main/cpp/**'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/NeuronKataGoBackend.java'
      - 'GoEngine-java/app/build.gradle.kts'
      - '.github/workflows/build_neuron_jni.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Compile Neuron JNI for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          mkdir -p build/neuron
          "$CXX" -std=c++17 -O2 -Wall -Wextra -fPIC -shared \
            GoEngine-java/app/src/main/cpp/neuron_katago_jni.cpp -ldl \
            -o build/neuron/libkatago_neuron_jni.so
          file build/neuron/libkatago_neuron_jni.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D \
            build/neuron/libkatago_neuron_jni.so | grep -F 'Java_com_badukai_engine_NeuronKataGoBackend_nativeEvaluate'
      - name: Build Java Android APK with JNI library
        working-directory: GoEngine-java
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: badukai-neuron-jni-arm64
          path: |
            build/neuron/libkatago_neuron_jni.so
            GoEngine-java/app/build/outputs/apk/debug/*.apk
