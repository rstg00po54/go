name: Restore RK3588 device-verified Human b18 9x9 model

on:
  workflow_dispatch:
  push:
    branches: [feature/rk3588-rknn]
    paths:
      - '.github/workflows/restore_rk3588_human_verified_9.yml'

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exactly the original model that passed real RK3588 parity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          gh run download 38842174488 -n rk3588-b18-human-9-experimental -D model
          find model -maxdepth 2 -type f -printf '%p %s bytes\n'
          MODEL="$(find model -name katago_human_9x9.rknn -type f -print -quit)"
          META="$(find model -name katago_human_9x9.json -type f -print -quit)"
          REF="$(find model -name human_b18_cpu9_reference.bin -type f -print -quit)"
          REF_META="$(find model -name human_b18_cpu9_reference.json -type f -print -quit)"
          test -s "$MODEL" && test -s "$META" && test -s "$REF" && test -s "$REF_META"
          echo "78bee9b2561c4ba14024c1428d750e4a4cec3206011290b6b6b1d7b1e95947c7  $MODEL" | sha256sum -c -
          test "$(wc -c < "$MODEL")" -eq 59069801
          python3 - "$META" "$REF" "$REF_META" <<'PY'
          import json,hashlib,pathlib,sys
          model=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert model["model"]=="b18c384nbt-humanv0" and model["board"]==9
          assert model["sha256"]=="78bee9b2561c4ba14024c1428d750e4a4cec3206011290b6b6b1d7b1e95947c7"
          ref=json.loads(pathlib.Path(sys.argv[3]).read_text())
          assert ref["model"]=="b18c384nbt-humanv0" and ref["board"]==9
          assert hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()==ref["fixtureSha256"]
          PY
          mkdir -p publish
          cp "$MODEL" publish/katago_human_9x9.rknn
          cp "$META" publish/katago_human_9x9.json
          cp "$REF" publish/human_b18_cpu9_reference.bin
          cp "$REF_META" publish/human_b18_cpu9_reference.json
          echo 'RK3588_HUMAN_9_VERIFIED_ARCHIVE_PASS'

      - name: Publish frozen device-verified Human b18 9x9 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=rk3588-human-b18-9x9-device-verified-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Immutable publishing policy: verified tag exists, refusing clobber'
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title 'RK3588 Human SL b18 9x9 device-verified RKNN' \
            --notes 'Exact SHA256 pinned model from original build 38842174488, verified on RK3588 against 20/20 CPU/NPU heads in real KataGo games. This release is never replaced by automated model recompiles.'
          gh release upload "$TAG" \
            publish/katago_human_9x9.rknn publish/katago_human_9x9.json \
            publish/human_b18_cpu9_reference.bin publish/human_b18_cpu9_reference.json
