name: RK3588 original Human b18 experimental RKNN 9x9

on:
  workflow_dispatch:
  push:
    branches: [feature/rk3588-rknn]
    paths:
      - '.github/workflows/rk3588_human_rknn_9.yml'
      - 'GoEngine-java/tools/build_rk3588_human_rknn.sh'
      - 'GoEngine-java/tools/convert_human_onnx_to_rknn.py'
      - 'GoEngine-java/tools/optimize_human_mish_onnx.py'
      - 'GoEngine-java/tools/check_human_mish_onnx_parity.py'
      - 'GoEngine-java/tools/export_human_rknn_cpu_reference.py'

permissions:
  contents: write

jobs:
  export-convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install RKNN conversion and numerical reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rknn-toolkit2==2.3.2' 'onnxruntime>=1.17,<2' 'numpy<=1.26.4' 'onnx==1.16.1'
      - name: Verify ONNX interface required by RKNN
        run: |
          python -c "import onnx; print('onnx', onnx.__version__); assert hasattr(onnx, 'mapping')"
      - name: Fetch original KataGo b18 weights and official ONNX exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_models kata_dist
          curl -fL --retry 3 -o source_models/b18.bin.gz \
            'https://github.com/lightvector/KataGo/releases/download/v1.15.0/b18c384nbt-humanv0.bin.gz'
          gzip -t source_models/b18.bin.gz
          gzip -dc source_models/b18.bin.gz > source_models/b18.bin
          test "$(wc -c < source_models/b18.bin)" -eq 107185997
          curl -fL --retry 3 -o katago_dist.zip \
            'https://github.com/lightvector/KataGo/releases/download/v1.18.1/katago-v1.18.1-onnx-openvino-linux-x64.zip'
          unzip -q katago_dist.zip -d kata_dist
          KATAGO_BIN="$(find "$PWD/kata_dist" -type f -name katago -print -quit)"
          test -n "$KATAGO_BIN"
          chmod +x "$KATAGO_BIN"
          echo "KATAGO_DUMPONNX_BIN=$KATAGO_BIN" >> "$GITHUB_ENV"
          echo "HUMAN_B18_MODEL=$PWD/source_models/b18.bin" >> "$GITHUB_ENV"
          LIBPATH="$(find "$PWD/kata_dist" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)"
          echo "LD_LIBRARY_PATH=$LIBPATH" >> "$GITHUB_ENV"
      - name: Export from original weights and convert to RK3588 without quantization
        shell: bash
        run: |
          set -o pipefail
          bash GoEngine-java/tools/build_rk3588_human_rknn.sh 9 2>&1 | tee rknn_build.log
      - name: Export original b18 ONNX CPU golden reference for RK3588 five heads
        shell: bash
        run: |
          set -euo pipefail
          python3 GoEngine-java/tools/export_human_rknn_cpu_reference.py \
            --onnx GoEngine-java/build/rk3588_human/9/human_9_original.onnx \
            --size 9 \
            --output GoEngine-java/build/rk3588_human/9/human_b18_cpu9_reference.bin \
            --manifest GoEngine-java/build/rk3588_human/9/human_b18_cpu9_reference.json
      - name: Publish compilation logs and experimental RKNN as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-b18-human-9-experimental
          path: |
            rknn_build.log
            GoEngine-java/build/rk3588_human/9/*.json
            GoEngine-java/build/rk3588_human/9/*.rknn
            GoEngine-java/build/rk3588_human/9/human_b18_cpu9_reference.bin
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified experimental Human RKNN model to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL=GoEngine-java/build/rk3588_human/9/katago_human_9x9.rknn
          META=GoEngine-java/build/rk3588_human/9/katago_human_9x9.json
          test -s "$MODEL"
          test -s "$META"
          python3 - <<'PY'
          import hashlib, json, pathlib
          model=pathlib.Path('GoEngine-java/build/rk3588_human/9/katago_human_9x9.rknn')
          meta=json.loads(pathlib.Path('GoEngine-java/build/rk3588_human/9/katago_human_9x9.json').read_text())
          assert meta['model']=='b18c384nbt-humanv0' and meta['board']==9
          assert meta['target']=='rk3588' and meta['quantized'] is False
          assert meta['inputs']=={'InputSpatial':[1,22,9,9], 'InputGlobal':[1,19,1,1], 'InputMeta':[1,192,1,1], 'InputMask':[1,1,9,9]}
          assert meta['outputs']==['OutputPolicyPass','OutputPolicy','OutputValue','OutputScoreValue','OutputOwnership']
          assert meta['runtimeVerified'] is False and meta['fiveHeadParityVerified'] is False
          assert hashlib.sha256(model.read_bytes()).hexdigest()==meta['sha256'], 'Compiled binary/manifest SHA mismatch'
          print('HUMAN_RKNN_RELEASE_MANIFEST_PASS sha256='+meta['sha256'])
          PY
          TAG=rk3588-human-b18-9x9-experimental-v1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title 'RK3588 original Human SL b18 9x9 (experimental)' \
              --notes 'Original b18 weights; 120 exact Mish rewrites; ONNX CPU five-head parity PASS. RKNN-Toolkit2 2.3.2 nonquantized RK3588 compilation PASS. Actual RK3588 runtime inference, human-rank behavior and CPU/NPU parity have NOT been tested. Not a production build.'
          fi
          python3 - <<'PY'
          import hashlib, json, pathlib
          out=pathlib.Path('GoEngine-java/build/rk3588_human/9')
          ref=out/'human_b18_cpu9_reference.bin'
          m=json.loads((out/'human_b18_cpu9_reference.json').read_text())
          assert m['model']=='b18c384nbt-humanv0' and m['board']==9
          assert m['cases']==4 and m['format']=='B18REF01-le-f32'
          assert m['cpuBackend']=='onnxruntime-cpu'
          assert m['syntheticInputsOnly'] is True
          assert hashlib.sha256(ref.read_bytes()).hexdigest()==m['fixtureSha256']
          print('HUMAN_REFERENCE_RELEASE_VERIFIED sha256='+m['fixtureSha256'])
          PY
          gh release upload "$TAG" "$MODEL" "$META" \
            GoEngine-java/build/rk3588_human/9/human_b18_cpu9_reference.bin \
            GoEngine-java/build/rk3588_human/9/human_b18_cpu9_reference.json --clobber
