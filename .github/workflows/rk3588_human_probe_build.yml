name: Build RK3588 Human b18 standalone Android probe

on:
  workflow_dispatch:
  push:
    branches: [feature/rk3588-rknn]
    paths:
      - '.github/workflows/rk3588_human_probe_build.yml'
      - 'GoEngine-java/tools/human_rknn_probe.cpp'
      - 'GoEngine-java/tools/human_rknn_parity.cpp'
      - 'GoEngine-java/tools/test_rk3588_human_parity.sh'
      - 'GoEngine-java/tools/run_rk3588_human_parity.py'
      - 'GoEngine-java/tools/test_run_rk3588_human_parity.py'
      - 'GoEngine-java/tools/upload_referee_test_results.py'
      - 'GoEngine-java/tools/test_rk3588_human_rknn.sh'

permissions:
  contents: read

jobs:
  android-arm64-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 验证 Human b18 精度报告上传与脚本语法
        shell: bash
        run: |
          set -euo pipefail
          bash -n GoEngine-java/tools/test_rk3588_human_parity.sh
          python3 -m py_compile GoEngine-java/tools/run_rk3588_human_parity.py
          python3 -m unittest discover -s GoEngine-java/tools -p 'test_run_rk3588_human_parity.py' -v
      - name: Install RKNN Android API and find NDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ROOT" && test -d "$ROOT/ndk"
          NDK="$(find "$ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          BASE=https://raw.githubusercontent.com/airockchip/rknn-toolkit2/v2.3.2/rknpu2/runtime/Android/librknn_api
          mkdir -p sdk/include build
          curl -fL --retry 3 "$BASE/include/rknn_api.h" -o sdk/include/rknn_api.h
          curl -fL --retry 3 "$BASE/arm64-v8a/librknnrt.so" -o sdk/librknnrt.so
      - name: Compile standalone Android ARM64 Human RKNN probe
        shell: bash
        run: |
          set -euo pipefail
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -O2 -fPIE -pie -static-libstdc++ -Wl,-z,max-page-size=16384 \
            -Isdk/include GoEngine-java/tools/human_rknn_probe.cpp \
            -Lsdk -lrknnrt -o build/human_rknn_probe
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -O2 -fPIE -pie -static-libstdc++ -Wl,-z,max-page-size=16384 \
            -Isdk/include GoEngine-java/tools/human_rknn_parity.cpp \
            -Lsdk -lrknnrt -o build/human_rknn_parity
          test -s build/human_rknn_parity
          file build/human_rknn_probe
          file build/human_rknn_parity
          file sdk/librknnrt.so
          test -s build/human_rknn_probe
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d build/human_rknn_probe | tee build/elf_deps.txt
          if grep -Fq 'libc++_shared.so' build/elf_deps.txt; then
            echo 'ERROR: Android probe unexpectedly depends on libc++_shared.so' >&2
            exit 1
          fi
          echo 'Android probe verified: no libc++_shared.so dependency'
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d build/human_rknn_parity | tee build/parity_elf_deps.txt
          if grep -Fq 'libc++_shared.so' build/parity_elf_deps.txt; then
            echo 'ERROR: Human parity executable unexpectedly needs libc++_shared.so' >&2
            exit 1
          fi
      - name: Upload test executable (not a hardware inference result)
        uses: actions/upload-artifact@v4
        with:
          name: human-rknn-probe-android-arm64
          path: |
            build/human_rknn_probe
            build/human_rknn_parity
          if-no-files-found: error
          retention-days: 14
