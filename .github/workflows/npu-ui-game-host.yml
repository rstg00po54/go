name: RK3588 NPU real game UI script checks

on:
  push:
    branches: [feature/rk3588-rknn]
    paths:
      - '.github/workflows/npu-ui-game-host.yml'
      - 'GoEngine-java/tools/test_app_ui.py'
      - 'GoEngine-java/tools/test_app_ui_units.py'
      - 'GoEngine-java/tools/test_rk3588_npu_game.sh'
      - 'GoEngine-java/tools/symbolize_npu_crash.sh'
      - 'GoEngine-java/tools/watch_npu_crash.py'
      - 'GoEngine-java/tools/test_watch_npu_crash.py'
      - 'GoEngine-java/tools/test_npu_session_lifecycle.py'
      - 'GoEngine-java/tools/test_android_npu_platform.py'
      - 'GoEngine-java/app/src/main/java/com/badukai/engine/KataGoEngine.java'
      - 'GoEngine-java/app/src/main/java/com/badukai/MainActivity.java'
      - 'GoEngine-java/native/KataGo/cpp/neuralnet/rknnbackend.cpp'
      - 'GoEngine-java/native/KataGo/cpp/command/gtp.cpp'
      - 'GoEngine-java/app/src/main/cpp/EngineSession.cpp'
      - 'GoEngine-java/native/KataGo/cpp/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Bash and Python syntax
        run: |
          bash -n GoEngine-java/tools/test_rk3588_npu_game.sh
          bash -n GoEngine-java/tools/symbolize_npu_crash.sh
          python3 -m py_compile GoEngine-java/tools/test_app_ui.py GoEngine-java/tools/test_app_ui_units.py \
            GoEngine-java/tools/watch_npu_crash.py GoEngine-java/tools/test_watch_npu_crash.py \
            GoEngine-java/tools/test_npu_session_lifecycle.py
      - name: Verify real-game UI automation and NPU parsing
        working-directory: GoEngine-java
        run: |
          python3 -m unittest discover -s tools -p 'test_app_ui_units.py' -v
          python3 -m unittest discover -s tools -p 'test_watch_npu_crash.py' -v
          python3 -m unittest discover -s tools -p 'test_npu_session_lifecycle.py' -v
          python3 -m unittest discover -s tools -p 'test_android_npu_platform.py' -v
