name: Android NN estimate quick regression
on:
  push:
    branches: [rk3588-engine]
    paths:
      - GoEngine-java/build.sh
      - GoEngine-java/tools/build_katago_from_source.sh
      - GoEngine-java/tools/check_katago_pie.py
      - GoEngine-java/tools/invalidate_unaligned_pie.py
      - GoEngine-java/tools/test_invalidate_unaligned_pie.py
      - GoEngine-java/app/build.gradle.kts
      - GoEngine-java/app/src/main/java/com/badukai/MainActivity.java
      - GoEngine-java/app/src/main/java/com/badukai/ui/GoBoardView.java
      - GoEngine-java/app/src/main/java/com/badukai/game/NnAreaScore.java
      - GoEngine-java/app/src/main/res/layout/activity_main.xml
      - GoEngine-java/tools/smoke_android_referee_app.py
      - GoEngine-java/tools/test_smoke_android_referee_app.py
      - GoEngine-java/tools/test_smart_referee.py
      - .github/workflows/referee-quick-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nn-quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install ADB for mocked host tests
        run: sudo apt-get update -qq && sudo apt-get install -y adb
      - name: Validate Android Gradle Kotlin build configuration
        working-directory: GoEngine-java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon help -PskipKataGoNative=true -PenableKataGoJniCore=false -PenableKataGoGpuJni=false
      - name: Syntax-check app build wrapper
        working-directory: GoEngine-java
        run: bash -n build.sh
      - name: Syntax-check NN test scripts
        working-directory: GoEngine-java
        run: python3 -m py_compile tools/smoke_android_referee_app.py tools/test_smoke_android_referee_app.py tools/test_smart_referee.py tools/check_katago_pie.py tools/invalidate_unaligned_pie.py tools/test_invalidate_unaligned_pie.py
      - name: Stale PIE cache invalidation regression
        working-directory: GoEngine-java
        run: python3 tools/test_invalidate_unaligned_pie.py
      - name: Native build wrapper syntax
        working-directory: GoEngine-java
        run: bash -n tools/build_katago_from_source.sh
      - name: NN area rules JDK-only test
        working-directory: GoEngine-java
        run: python3 tools/test_smart_referee.py
      - name: Host NN UI smoke tests
        working-directory: GoEngine-java
        run: python3 tools/test_smoke_android_referee_app.py
