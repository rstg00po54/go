# Gradle 配置
# GitHub Hosted Runner (ubuntu-latest) 为 2C7G，给 Gradle 2.5GB 避免 D8/R8 合并 dex OOM；
# 同时禁用 parallel 构建，减少并发内存开销。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
